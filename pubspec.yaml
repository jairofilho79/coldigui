name: coldigui
description: PLPCG — Pesquisador de Louvores em Partitura, Cifra e Gestos (Flutter 3)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.0
  dio: ^5.7.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  isar_plus: ^1.3.7
  isar_plus_flutter_libs: ^1.3.7
  path_provider: ^2.1.6
  share_plus: ^13.2.0
  shared_preferences: ^2.3.4
  web: ^1.1.1
  app_links: ^7.0.0
  connectivity_plus: ^7.2.0
  wakelock_plus: ^1.5.2
  flutter_svg: ^2.2.0
  pdfrx: ^2.4.4
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon_source.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo_colorido.svg
    - assets/branding/logo_colorido_no_bg.svg
    - assets/branding/logo_colorido_no_bg_inline.svg
    - assets/branding/logo_colorido_no_bg_logo_only.svg
    - assets/fixtures/sample.pdf
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond[wght].ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans[wdth,wght].ttf

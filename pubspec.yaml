name: coldigui
description: PLPCG — Pesquisador de Louvores em Partitura, Cifra e Gestos (Flutter 3)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.0
  disk_space_plus: ^0.2.4
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  pdfx: ^2.8.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  app_links: ^7.0.0
  connectivity_plus: ^6.1.4
  wakelock_plus: ^1.5.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fixtures/sample.pdf
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond[wght].ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans[wdth,wght].ttf

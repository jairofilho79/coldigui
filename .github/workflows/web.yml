# Web build and Chrome smoke tests (WEB_BUILD Fase 7 — D9).
name: Web

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: ./scripts/setup_deps.sh

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests (VM)
        run: flutter test

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Chrome smoke tests
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          flutter test \
            --platform chrome \
            --dart-define-from-file=dart_defines/plpcjf.json \
            test/web/

      - name: Build web (WASM)
        run: |
          flutter build web \
            --wasm \
            --dart-define-from-file=dart_defines/plpcjf.json

      - name: Verify COOP/COEP headers artifact
        run: ./scripts/verify_web_headers_artifact.sh

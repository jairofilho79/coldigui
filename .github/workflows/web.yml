# Web build and Chrome smoke tests (WEB_BUILD Fase 7 — D9).
name: Web

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: ./scripts/setup_deps.sh

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests (VM)
        run: flutter test

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Chrome smoke tests
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          flutter test \
            --platform chrome \
            --dart-define-from-file=dart_defines/plpcjf.json \
            test/web/

      - name: Build web (WASM)
        run: |
          flutter build web \
            --wasm \
            --dart-define-from-file=dart_defines/plpcjf.json

      # Mesmo pós-build do deploy (scripts/web_build.sh): ?v=<tag>, canvaskit/<hash>/
      # e as listas CRITICAL/WARM do sw.js. O verify a seguir exige-o.
      - name: Cache-bust entrypoints + service worker manifest
        run: ./scripts/cache_bust_web_entrypoints.sh

      - name: Verify headers artifact and service worker
        run: ./scripts/verify_web_headers_artifact.sh

      - name: Web boot performance gate
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./scripts/measure_web_boot.sh --check

  # Testes do Worker `plpcg-catalog` (`node:test` sobre os módulos puros e os
  # handlers de playlist com um D1 falso). Independente do job `web`: não
  # compila Flutter e não aplica migração remota — deploy é do dono.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: workers/plpcg-catalog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

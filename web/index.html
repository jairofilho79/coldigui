<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="isar_plus.wasm" as="fetch" crossorigin="anonymous">

  <script>
    (function () {
      function supportsSkwasmPreload() {
        try {
          return (
            typeof WebAssembly !== 'undefined' &&
            typeof SharedArrayBuffer !== 'undefined' &&
            window.crossOriginIsolated === true
          );
        } catch (e) {
          return false;
        }
      }

      window.__plpcgPerf = window.__plpcgPerf || {};
      var rendererPreload = supportsSkwasmPreload() ? 'skwasm' : 'fallback';
      window.__plpcgPerf.rendererPreload = rendererPreload;

      if (rendererPreload === 'skwasm') {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.href = 'canvaskit/skwasm.wasm';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pesquisador e visualizador online e offline de partituras, cifras e gestinhos de louvores da ICM (Não Oficial)">
  <meta name="theme-color" content="#D4AF37">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLPCG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PLPCG</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: #4B2D2B;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #4B2D2B;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading img {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
    }

    #loading .title {
      margin: 0 0 32px;
      color: #D4AF37;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 175, 55, 0.25);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: plpcg-spin 0.8s linear infinite;
    }

    @keyframes plpcg-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite" aria-busy="true">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <p class="title">PLPCG</p>
    <div class="spinner" role="progressbar" aria-label="Carregando"></div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loading');
      if (!loader) return;

      var removed = false;
      var navigationStart = 0;
      var navEntry = performance.getEntriesByType('navigation')[0];
      if (navEntry) {
        navigationStart = navEntry.startTime;
      }

      function msSinceNav() {
        return Math.round(performance.now() - navigationStart);
      }

      function markLoaderVisible() {
        performance.mark('plpcg-loader-visible');
        window.__plpcgPerf = window.__plpcgPerf || {};
        window.__plpcgPerf.loaderVisibleMs = msSinceNav();
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(markLoaderVisible);
      });

      function capturePerf() {
        performance.mark('plpcg-first-frame');
        try {
          performance.measure('plpcg-loader', {
            start: navigationStart,
            end: 'plpcg-loader-visible',
          });
          performance.measure('plpcg-first-frame', {
            start: navigationStart,
            end: 'plpcg-first-frame',
          });
        } catch (e) {}

        var loaderMs =
          window.__plpcgPerf && window.__plpcgPerf.loaderVisibleMs;
        var rendererPreload =
          window.__plpcgPerf && window.__plpcgPerf.rendererPreload;
        var perf = {
          loaderVisibleMs: loaderMs != null ? loaderMs : null,
          firstFrameMs: msSinceNav(),
          crossOriginIsolated: window.crossOriginIsolated,
          sab: typeof SharedArrayBuffer,
          rendererPreload: rendererPreload || null,
          capturedAt: new Date().toISOString(),
        };
        window.__plpcgPerf = perf;
        window.dispatchEvent(
          new CustomEvent('plpcg-perf-ready', { detail: perf }),
        );
      }

      function hideLoader() {
        if (removed) return;
        removed = true;
        capturePerf();
        loader.classList.add('hidden');
        loader.setAttribute('aria-busy', 'false');
        window.setTimeout(function () {
          loader.remove();
        }, 450);
      }

      window.addEventListener('flutter-first-frame', hideLoader, { once: true });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
